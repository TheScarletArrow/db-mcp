services:
  db-mcp:
    build: .
    image: db-mcp:local
    container_name: db-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"        # MCP endpoint: http://127.0.0.1:8080/mcp
    environment:
      # Strongly recommended: the vault key is derived from this passphrase.
      # Without it a random key file is generated once inside the volume (also persistent).
      DB_MCP_MASTER_PASSWORD: ${DB_MCP_MASTER_PASSWORD:-}
      DB_MCP_ALLOW_WRITES: ${DB_MCP_ALLOW_WRITES:-false}
      # Uncomment to reach databases running on the Docker host by name `host.docker.internal`.
      # JAVA_OPTS: ""
    volumes:
      # Named volume keeps vault.enc / vault.key across container restarts and image upgrades.
      - db-mcp-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db-mcp-data:
